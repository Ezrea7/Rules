[rewrite_local]
# > Hulu去广告
^https:\/\/vodmanifest\.hulustream\.com\/hulu\/v\d+\/hls\/(video|audio)\/\d+\/ url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Hulu/JS/Hulu.js
^https:\/\/vodmanifest\.hulustream\.com\/hulu\/v\d+\/hls\/vtt\/\d+\/playlist\.m3u8 url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Hulu/JS/Hulu.js

# > Hulu强制1080p
^https:\/\/vodmanifest\.hulustream\.com\/hulu\/v\d+\/hls\/multivariant\/\d+\/playlist\.m3u8 url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Hulu/JS/Hulu.js

# > Hulu去播放器台标水印
^https:\/\/discover\.hulu\.com\/content\/v\d+\/hubs\/series\/ url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Hulu/JS/Hulu.js
^https:\/\/discover\.hulu\.com\/content\/v\d+\/browse\/upnext\? url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Hulu/JS/Hulu.js

[mitm]
hostname = discover.hulu.com, vodmanifest.hulustream.com
