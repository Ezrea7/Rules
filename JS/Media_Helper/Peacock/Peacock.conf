[rewrite_local]
# Peacock去广告
^https:\/\/.*?\.mediatailor\..*?\.amazonaws\.com\/v\d+\/tracking\/\w+\/peacock\-cmaf\-hls\-vod url reject
^https:\/\/.*?\.mediatailor\..*?\.amazonaws\.com\/v\d+\/manifest\/\w+\/peacock\-cmaf\-hls\-vod.*?\/\d+\.m3u8 url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Peacock/JS/Peacock.js

# Peacock外挂srt字幕
^https:\/\/atom\.peacocktv\.com\/adapter\-calypso\/v\d+\/query\/node/.*?\?represent=\(next url script-response-header https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Peacock/JS/Peacock.js
^https:\/\/.*?\.cdn\.peacocktv\.com\/.*?\.webvtt$ url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Peacock/JS/Peacock.js

# Peacock强制1080p
^https:\/\/.*?\.cdn\.peacocktv\.com\/.*?\/master_cmaf\.m3u8 url script-response-body https://raw.githubusercontent.com/Ezrea7/Script/main/JS/Media_Helper/Peacock/JS/Peacock.js

[mitm]
hostname = *.peacocktv.com, *.mediatailor.*.amazonaw.com
