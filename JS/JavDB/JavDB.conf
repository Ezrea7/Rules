[filter_local]
host-suffix, mc.yandex.ru, reject
host-suffix, static.cloudflareinsights.com, reject

[rewrite_local]
# > JavDB去广告
https?:\/\/javdb\.com\/(?!(.*(api|login|cdn-cgi|verify|auth|captch|(\.(js|css|jpg|jpeg|png|webp|gif|zip|woff|woff2|m3u8|mp4|mov|m4v|avi|mkv|flv|rmvb|wmv|rm|asf|asx|mp3|json|ico|otf|ttf))))) url script-response-body https://raw.githubusercontent.com/Ezrea7/Rules/main/JS/JavDB/JS/JavDB.ad.js

# > MissAV去广告
https?:\/\/missav\.(ws|live|com|ai)\/(?!(.*(api|login|cdn-cgi|verify|auth|captch|(\.(js|css|jpg|jpeg|png|webp|gif|zip|woff|woff2|m3u8|mp4|mov|m4v|avi|mkv|flv|rmvb|wmv|rm|asf|asx|mp3|json|ico|otf|ttf))))) url script-response-body https://raw.githubusercontent.com/Ezrea7/Rules/main/JS/JavDB/JS/MissAV.ad.js

[mitm]
hostname = javdb.com, missav.live, missav.ws, missav.ai, missav.com
