name: Sync Upstream & Replace Fields

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * *" # 每天北京时间凌晨 01:00
  workflow_dispatch:

concurrency:
  group: sync-upstream-and-replace
  cancel-in-progress: false

jobs:
  sync-and-replace:
    name: Sync from upstream and replace repository strings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Clone upstream repository
        run: |
          rm -rf /tmp/upstream-repo
          git clone --depth 1 --branch main https://github.com/BOBOLAOSHIV587/Rules.git /tmp/upstream-repo

      - name: Sync upstream files
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            /tmp/upstream-repo/ ./

      - name: Replace repository fields
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = [
              ("BOBOLAOSHIV587/Rules", "Ezrea7/Script"),
              ("啵啵老师", "Ezrea7"),
          ]

          def should_skip(path: Path) -> bool:
              parts = path.parts
              if ".git" in parts:
                  return True
              if len(parts) >= 2 and parts[0] == ".github" and parts[1] == "workflows":
                  return True
              return False

          for path in Path(".").rglob("*"):
              if path.is_dir() or should_skip(path):
                  continue

              try:
                  data = path.read_bytes()
              except Exception:
                  continue

              if b"\x00" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              new_text = text
              for old, new in replacements:
                  new_text = new_text.replace(old, new)

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  print(f"updated: {path}")
          PY

      - name: Check changes
        run: |
          git status --short
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: sync upstream and replace repository strings"
          git push origin HEAD:main
